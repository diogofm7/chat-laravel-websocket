name: Deploy Webchat

on:
  workflow_dispatch:

jobs:
  cd:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        node: [ 14 ]
        php: [ 8.0 ]
        include:
          - composer-options: "--ignore-platform-reqs"

    steps:
      - uses: "actions/checkout@v4"
        with:
          ref: master

      - uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php }}"

      - name: Create .env file
        run: |
          touch .env
          echo VITE_PUSHER_SCHEME=https >> .env
          echo VITE_PUSHER_APP_KEY=${{ secrets.WS_KEY }} >> .env
          echo VITE_PUSHER_APP_CLUSTER=${{ secrets.WS_CLUSTER }} >> .env

      - uses: "ramsey/composer-install@v3"
        with:
          composer-options: "${{ matrix.composer-options }}"

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run prod

      - name: Adicionar PHPVersion no .htaccess
        run: |
          cat - public/.htaccess > tmp <<'EOF'
          #+PHPVersion
          #=php80
          AddHandler x-httpd-php80 .php
          #-PHPVersion
          EOF
          mv tmp public/.htaccess

      - name: Commit admin
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -B deploy
          git add -A -f -- public/
          git commit -m "Build admin" --allow-empty
          git push -f origin deploy
